<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jaden Doktè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef3ea; --paper:#fbfaf5; --card:#ffffff; --ink:#132a1e; --muted:#5c6b61; --line:#dfe6db;
  --forest:#13472f; --forest-2:#1d5c3d; --leaf:#4f9a5d; --leaf-soft:#e5f1e3; --gold:#f3c43a;
  --amber:#f6c552; --amber-soft:#fdf1d6; --amber-ink:#5a3b00; --ok-soft:#dff1df; --ok-ink:#226b35; --sick:#d9483b; --sick-soft:#fbe1dd;
  --shadow:0 1px 2px rgba(19,42,30,.06),0 10px 28px rgba(19,42,30,.08); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none!important}
.frame{background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
/* header */
.head{position:relative;background:var(--forest);color:#fff;padding:18px 18px 64px;overflow:hidden}
.head .bgimg{position:absolute;right:-20px;top:0;height:100%;width:62%;object-fit:cover;opacity:.55;-webkit-mask-image:linear-gradient(to right,transparent,#000 45%);mask-image:linear-gradient(to right,transparent,#000 45%)}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:25px;letter-spacing:-.02em}
.logo svg{width:34px;height:34px}
.logo b{color:var(--gold);font-weight:800}
.lang{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font:inherit;font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--leaf)}
.head h1{position:relative;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:22px 0 10px;max-width:11ch;text-wrap:balance}
.head p{position:relative;margin:0;max-width:30ch;opacity:.92;font-size:15px}
.body{padding:0 16px 18px;display:grid;gap:14px}
.shoot{margin-top:-46px;position:relative;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px;overflow:hidden}
.shoot .pimg{position:absolute;right:-6px;top:-4px;width:46%;height:120px;object-fit:cover;-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent);border-radius:0 20px 0 0}
.shoot .t{position:relative;display:flex;align-items:center;gap:14px}
.ic{width:54px;height:54px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center;flex:none}
.ic svg{width:26px;height:26px}
.shoot h2{margin:0;font-size:22px;line-height:1.1;font-weight:800;max-width:9ch}
.shoot .hint{position:relative;color:var(--muted);font-size:14px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.btn svg{width:24px;height:24px}
.btn.dark{background:var(--forest);color:#fff}
.btn.line{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.preview{display:flex;align-items:center;gap:12px;background:var(--leaf-soft);border-radius:14px;padding:8px}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.preview span{font-weight:700;color:var(--ok-ink);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px;font-weight:700;font-size:15px}
.sel{position:relative;display:flex;align-items:center}
.sel svg{position:absolute;left:14px;width:20px;height:20px;pointer-events:none}
select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%}
select{padding:13px 12px 13px 44px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
textarea{padding:12px;min-height:84px;resize:vertical}
.count{text-align:right;font-size:12px;color:var(--muted);margin-top:-30px;padding-right:12px;pointer-events:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.status{text-align:center;color:var(--muted);font-size:14px;min-height:18px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.sec h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec h2 svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--ok-ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.diag{display:grid;grid-template-columns:78px 1fr 16px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.diag img{width:78px;height:68px;object-fit:cover;border-radius:10px}
.diag .t{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.diag .s{color:var(--muted);font-size:14px}.diag .d{color:var(--muted);font-size:12.5px}
.pill{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.p-watch{background:var(--amber);color:var(--amber-ink)} .p-ok{background:var(--ok-soft);color:var(--ok-ink)} .p-sick{background:var(--sick-soft);color:var(--sick)}
.ex{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
/* result */
.rhead{background:var(--forest);color:#fff;padding:14px 16px}
.rhead .bar{gap:12px}.back{border:0;background:none;color:#fff;cursor:pointer;width:32px;height:32px;padding:0}
.back svg{width:24px;height:24px}
.photo{position:relative;background:#173;aspect-ratio:2/1}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.expand{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:50%;background:rgba(10,20,15,.65);border:0;display:grid;place-items:center;cursor:pointer}
.expand svg{width:22px;height:22px}
.sheet{background:var(--paper);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:20px 16px;display:grid;gap:14px}
.stat{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:9px 16px;border-radius:999px;justify-self:start}
.stat svg{width:22px;height:22px}
.titlerow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.sheet h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.conf{color:var(--muted);font-size:16px;margin-top:4px}
.badge{width:64px;height:64px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center}
.badge svg{width:32px;height:32px}
.desc{color:var(--muted);font-size:17px;line-height:1.5}
.box{border-radius:18px;padding:16px;display:grid;gap:10px}
.box h3{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.box h3 svg{width:24px;height:24px}
.sym{background:var(--amber-soft)} .sym h3{color:#7a4a00}
.sym ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.sym li{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:baseline}
.sym li::before{content:"";width:9px;height:9px;border-radius:50%;background:#f0a020;transform:translateY(-1px)}
.act{background:#eef3ea}
.act ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:n}
.act li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;counter-increment:n}
.act li::before{content:counter(n);width:36px;height:36px;border-radius:50%;background:#dde8d8;display:grid;place-items:center;font-weight:800;color:var(--ok-ink)}
details{background:var(--card);border:1px solid var(--line);border-radius:16px}
summary{list-style:none;display:grid;grid-template-columns:36px 1fr 20px;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary svg.i{width:30px;height:30px}
summary .t{font-weight:800;font-size:17px} summary .s{color:var(--muted);font-size:13.5px}
summary .chev{width:18px;height:18px;transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.dbody{padding:0 16px 16px 64px;display:grid;gap:10px}
.dbody ul{margin:0;padding-left:18px;display:grid;gap:6px}
.dbody .k{font-weight:800;font-size:14px;color:var(--ok-ink)}
.warn{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.help{background:var(--sick-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.note{background:#eef0ec;border-radius:16px;padding:14px;display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink);font-size:15px;display:block;margin-bottom:2px}
.note svg{width:26px;height:26px}
.loading{display:grid;gap:10px}
.skel{height:22px;border-radius:8px;background:linear-gradient(90deg,#e8ede4,#f6f8f3,#e8ede4);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.zoom{position:fixed;inset:0;background:rgba(5,12,8,.92);z-index:20;display:grid;place-items:center;padding:16px}
.zoom img{max-width:100%;max-height:90%;border-radius:12px}
.zoom[hidden]{display:none}
/* tips */
.tip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:44px 1fr;gap:12px}
.tip .e{width:44px;height:44px;border-radius:12px;background:var(--leaf-soft);display:grid;place-items:center;font-size:22px}
.tip b{display:block;margin-bottom:2px}
.tip p{margin:0;color:var(--muted);font-size:14.5px}
.page{padding:16px;display:grid;gap:12px}
.page h1{margin:4px 0;font-size:28px;font-weight:800}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;padding:10px 0 12px;display:grid;justify-items:center;gap:3px;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;position:relative}
.tabs svg{width:26px;height:26px}
.tabs button[aria-current="page"]{color:var(--forest);font-weight:800}
.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:4px;width:56px;height:4px;border-radius:4px;background:var(--forest)}
@media (max-width:400px){.head h1{font-size:29px}.grid2{grid-template-columns:1fr}.sheet h1{font-size:28px}.shoot .pimg{width:40%}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.chev{transition:none}}
</style>

  const mid=el("div");const t=el("div","t",tr(h.data.crop)||"—");const st=["ok","watch","sick"].includes(h.data.status)?h.data.status:"watch";
  t.append(el("span","pill p-"+st,T[L][st]));if(h.example)t.append(el("span","ex",T[L].example));
  mid.append(t,el("div","s",tr(h.data.problem)),el("div","d",h.date));
  const ch=el("span",null,"›");ch.style.fontSize="24px";b.append(img,mid,ch);b.onclick=()=>openResult(h);return b}
function renderRecent(){const R=$("recent");R.innerHTML="";const l=all().slice().reverse().slice(0,2);if(!l.length)R.append(el("div","status",T[L].empty));l.forEach(h=>R.append(diagRow(h)))}
function renderHist(){const R=$("histList");R.innerHTML="";const l=all().slice().reverse();if(!l.length)R.append(el("div","status",T[L].empty));l.forEach(h=>R.append(diagRow(h)))}
function renderTips(){const R=$("tipsList");R.innerHTML="";T[L].tipsData.forEach(([e,b,p])=>{const c=el("div","tip");c.append(el("div","e",e));const d=el("div");d.append(el("b",null,b),el("p",null,p));c.append(d);R.append(c)})}

/* ---------- résultat ---------- */
let curEntry=null;
const ICON={warn:'<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="#5a3b00"/><path d="M12 10v5M12 17.5v.5" stroke="#f6c552" stroke-width="2.2"/></svg>',
 ok:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#226b35"/><path d="M7 12l3.5 3.5L17 9" stroke="#fff" stroke-width="2.4" fill="none"/></svg>',
 sick:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#d9483b"/><path d="M12 7v6M12 16v1" stroke="#fff" stroke-width="2.4"/></svg>',
 leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="#1d5c3d" stroke-width="1.8"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-15 15z"/><path d="M5 19l9-9"/></svg>',
 sym:'<svg viewBox="0 0 24 24"><path d="M5 20C5 11 11 5 20 4c0 9-5 15-15 16z" fill="#7a4a00"/><path d="M5 20l8-8" stroke="#fdf1d6" stroke-width="1.6"/></svg>',
 wrench:'<svg viewBox="0 0 24 24" fill="#13472f"><path d="M21 7a5 5 0 0 1-7 4.6L6.4 19.2a2 2 0 0 1-2.8-2.8L11.2 9A5 5 0 0 1 17 3l-3 3 1 3 3 1z"/></svg>',
 treat:'<svg class="i" viewBox="0 0 24 24"><path d="M5 20C5 10 11 5 20 4c0 9-5 15-15 16z" fill="#3a8f4a"/><path d="M5 20l9-9" stroke="#fff" stroke-width="1.5"/></svg>',
 shield:'<svg class="i" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#226b35"/><path d="M8 12l3 3 5-6" stroke="#fff" stroke-width="2.2" fill="none"/></svg>',
 phone:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#d9483b"/><path d="M12 7v6M12 16v1" stroke="#fff" stroke-width="2.4"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>',
 info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#6b746e"/><path d="M12 11v6M12 7.5v.5" stroke="#fff" stroke-width="2.2"/></svg>'};
function ul(arr){const u=el("ul");(arr||[]).forEach(x=>u.append(el("li",null,typeof x==="string"?x:`${x.family} — ${x.active}`)));return u}
function acc(icon,title,sub,content){const d=el("details");const s=el("summary");s.innerHTML=icon;const m=el("div");m.append(el("div","t",title),el("div","s",sub));s.append(m);s.insertAdjacentHTML("beforeend",ICON.chev);d.append(s);const b=el("div","dbody");content.forEach(c=>b.append(c));d.append(b);return d}
function renderResult(h){curEntry=h;const t=T[L],d=h.data,S=$("sheet");S.innerHTML="";$("rImg").src=h.photo||h.thumb;
  const st=["ok","watch","sick"].includes(d.status)?d.status:"watch";
  const pill=el("div","stat p-"+st);pill.innerHTML=st==="watch"?ICON.warn:st==="ok"?ICON.ok:ICON.sick;pill.append(t[st]);S.append(pill);
  const tr0=el("div","titlerow");const l=el("div");l.append(el("h1",null,tr(d.problem)||"—"),el("div","conf",d.certainty==="prob"?t.prob:t.hyp));
  const bd=el("div","badge");bd.innerHTML=ICON.leaf;tr0.append(l,bd);S.append(tr0);
  if(tr(d.description))S.append(el("div","desc",tr(d.description)));
  const sg=tr(d.signs);if(sg&&sg.length){const b=el("div","box sym");const h3=el("h3");h3.innerHTML=ICON.sym;h3.append(t.symptoms);b.append(h3,ul(sg));S.append(b)}
  const nw=tr(d.now);if(nw&&nw.length){const b=el("div","box act");const h3=el("h3");h3.innerHTML=ICON.wrench;h3.append(t.actions);const o=el("ol");nw.forEach(x=>o.append(el("li",null,x)));b.append(h3,o);S.append(b)}
  const nat=tr(d.natural)||[],pr=d.products||[];
  if(nat.length||pr.length){const parts=[];if(nat.length)parts.push(el("div","k",t.natural),ul(nat));if(pr.length)parts.push(el("div","k",t.products),ul(pr),el("div","warn","⚠️ "+t.safety));S.append(acc(ICON.treat,t.treat,t.treatS,parts))}
  const pv=tr(d.prevent);if(pv&&pv.length)S.append(acc(ICON.shield,t.prevent,t.preventS,[ul(pv)]));
  if(tr(d.help))S.append(acc(ICON.phone,t.help,t.helpS,[el("div","help",tr(d.help))]));
  const n=el("div","note");n.innerHTML=ICON.info;const nx=el("div");nx.append(el("b",null,t.note1),t.note2);n.append(nx);S.append(n)}
function openResult(h){renderResult(h);go("res")}
$("backBtn").onclick=()=>{ctl&&ctl.abort();go("home")};
$("expBtn").onclick=()=>{$("zoomImg").src=$("rImg").src;$("zoom").hidden=false};$("zoom").onclick=()=>$("zoom").hidden=true;

/* ---------- photo + analyse ---------- */
let file=null,sample=null,canImg=false,ctl=null;
$("camBtn").onclick=()=>$("fileCam").click();$("galBtn").onclick=()=>$("fileGal").click();
function pick(f){if(!f)return;if(!/^image\//.test(f.type)){$("homeStatus").textContent="JPEG, PNG, WebP";return}file=f;$("prevImg").src=URL.createObjectURL(f);$("preview").hidden=false;$("homeStatus").textContent=""}
$("fileCam").onchange=e=>pick(e.target.files[0]);$("fileGal").onchange=e=>pick(e.target.files[0]);
$("obs").oninput=()=>$("cnt").textContent=$("obs").value.length;
function loadImg(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}
function shrink(im,max,q){const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
function prompt(){return `Tu es agronome, spécialiste des cultures tropicales et des jardins (Haïti, Caraïbes, Afrique, Amérique latine) mais tu connais toutes les plantes. Examine la photo.
Culture indiquée : ${$("crop").value}. Depuis : ${$("since").value}. Symptômes signalés : ${$("obs").value.trim()||"aucun"}.
Évalue la santé de la plante et propose une prise en charge simple pour un petit agriculteur ou un jardinier. Indique les gestes simples et les solutions naturelles en premier. Pour les produits du commerce, donne seulement la famille et la matière active (jamais de marque, jamais de dose). Si la plante est saine, dis-le (status "ok"). Si la photo ne montre pas une plante, status "watch" et explique-le dans problem.
Réponds en ${T[L].lang}, uniquement avec un objet JSON :
{"crop":"Tomate","status":"ok|watch|sick","problem":"nom court du problème","certainty":"hyp|prob","description":"1 à 2 phrases","signs":["…"],"now":["3 gestes immédiats"],"natural":["…"],"products":[{"family":"…","active":"…"}],"prevent":["…"],"help":"quand appeler un agronome"}`}
$("goBtn").onclick=async()=>{const t=T[L];
  if(!file){$("homeStatus").textContent=t.noPhoto;return}
  const im=await loadImg(file).catch(()=>null);
  const entry={id:"d"+Date.now(),date:new Date().toLocaleDateString(L==="fr"?"fr-FR":"fr-HT",{day:"2-digit",month:"2-digit"}),photo:im?shrink(im,900,.8):"",thumb:im?shrink(im,160,.75):"",data:null};
  curEntry=entry;$("rImg").src=entry.photo;const S=$("sheet");S.innerHTML="";const ld=el("div","loading");ld.append(el("div","status",t.busy));for(let i=0;i<5;i++){const s=el("div","skel");s.style.width=(90-i*12)+"%";ld.append(s)}S.append(ld);go("res");
  $("goBtn").disabled=true;ctl=new AbortController();
  try{if(!im)throw{code:"image_rejected"};const d=await Dokte.diagnose(im,$("crop").selectedIndex,null);
    entry.data=d;renderResult(entry);hist.push(entry);if(hist.length>25)hist.shift();
    if(!store("jd-hist",hist)){hist.forEach(x=>x.photo=x.thumb);store("jd-hist",hist)}renderRecent();renderHist();
  }catch(e){console.error(e);if(e.code==="cancelled"){go("home")}else{S.innerHTML="";S.append(el("div","status",t.err[e.code]||t.err.other));const b=el("button","btn dark",t.go);b.onclick=()=>{go("home")};S.append(b)}
    if(["not_granted","sampling_disabled","images_unavailable"].includes(e.code))canImg=false}
  finally{$("goBtn").disabled=false}};

applyLang();
Dokte.load().catch(()=>{});
</script>
